name: Bug report
description: Something in Nowsee does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.4"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Visualization
      options:
        - Spectrogram
        - Waveform
        - Ocean
        - Bars
        - Stereo
        - Morph
        - Not specific to one mode

  - type: checkboxes
    id: windows
    attributes:
      label: Which windows were open
      description: >
        This matters for anything about CPU or frame rate. The settings window roughly doubles
        CPU use, and a covered window stops rendering entirely.
      options:
        - label: The visualizer window
        - label: The settings window

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        Run `NOWSEE_DIAGNOSTICS=1 open /Applications/Nowsee.app`, reproduce, then paste a few
        lines from `~/Library/Logs/nowsee.log`.
      render: text
